<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amandinha Fitness</title>
<meta name="theme-color" content="#f5f5f7">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Amandinha">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0;color-scheme:light}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}
/* Layout: app de uma coluna (máx. 560px), barra de título translúcida, tab bar estilo iOS, sheets que sobem do rodapé.
   Tema claro obrigatório (sem modo escuro). Identidade inspirada na linguagem visual da Apple (iOS/macOS): neutros #F5F5F7/#1D1D1F/#6E6E73, azul de ação, fonte do sistema (SF Pro). */
:root {
  --bg: #f5f5f7;
  --surface: #ffffff;
  --surface2: #f5f5f7;
  --fg: #1d1d1f;
  --muted: #6e6e73;
  --line: #d2d2d7;
  --accent: #0071e3;
  --accent-ink: #ffffff;
  --accent-soft: #e8f1fc;
  --teal: #248a3d;
  --teal-soft: #e5f5e9;
  --amber: #b25000;
  --amber-soft: #fff1e0;
  --danger: #d70015;
  --danger-soft: #fdecee;
  --strava: #e34402;
  --strava-soft: #fde9df;
  --glass: rgba(245, 245, 247, .78);
  --tabglass: rgba(255, 255, 255, .78);
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 18px rgba(0, 0, 0, .045);
  --font-d: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-b: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 20px;
  --ease: cubic-bezier(.32, .72, 0, 1);
  --field: #ffffff;
  color-scheme: light only;
}
html, body { background: #f5f5f7; color: #1d1d1f; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-b); font-size: 16px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-d); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 1.9rem; line-height: 1.1; font-weight: 700; }
h2 { font-size: 1.25rem; font-weight: 650; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Boot / login ---------- */
.boot { min-height: 60vh; display: grid; place-items: center; color: var(--muted); }
.login {
  min-height: 100vh; display: flex; flex-direction: column; justify-content: center; gap: 28px;
  max-width: 460px; margin: 0 auto;
  padding-block: 40px;
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
}
.wordmark { font-family: var(--font-d); font-weight: 800; font-size: clamp(3rem, 15vw, 4.4rem); line-height: .9; letter-spacing: -0.04em; }
.wordmark span { display: block; color: var(--accent); font-weight: 500; font-style: italic; letter-spacing: -0.02em; }
.login .lead { font-size: 1.1rem; color: var(--muted); max-width: 30ch; }
.btn-google {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  background: var(--fg); color: var(--bg); border: 0; border-radius: 999px; padding: 16px 22px; font-weight: 600; font-size: 1rem;
}
.btn-google svg { width: 20px; height: 20px; background: #fff; border-radius: 50%; padding: 2px; }
.login .note { font-size: .88rem; color: var(--muted); background: var(--surface2); padding: 12px 14px; border-radius: 12px; }
.login .err { color: var(--danger); font-size: .92rem; }

/* ---------- Shell ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { font-family: var(--font-d); font-weight: 800; font-size: 1.15rem; letter-spacing: -0.03em; }
.brand span { color: var(--accent); font-style: italic; font-weight: 500; margin-left: 4px; }
.avatar {
  width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
  display: grid; place-items: center; overflow: hidden; font-weight: 700; font-family: var(--font-d); padding: 0;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
main {
  max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;
  padding-top: 4px;
  padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main.has-timer { padding-bottom: calc(170px + env(safe-area-inset-bottom, 0px)); }
.demo-flag { font-size: .8rem; background: var(--amber-soft); color: var(--amber); padding: 8px 12px; border-radius: 10px; }

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tabs button {
  background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: .68rem; font-weight: 600; color: var(--muted); padding: 6px 0;
}
.tabs svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabs button[aria-current="page"] { color: var(--accent); }

/* ---------- Common blocks ---------- */
.card { background: var(--surface); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 8px; }
.sec { font-size: 1rem; padding-top: 8px; color: var(--muted); font-family: var(--font-b); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .78rem; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.big { font-family: var(--font-d); font-size: 2.2rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
.big small { font-size: .9rem; font-weight: 500; color: var(--muted); margin-left: 3px; letter-spacing: 0; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: .74rem; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface2); color: var(--muted); white-space: nowrap; }
.chip.pink { background: var(--accent-soft); color: var(--accent); }
.chip.teal { background: var(--teal-soft); color: var(--teal); }
.chip.amber { background: var(--amber-soft); color: var(--amber); }
.delta.down { color: var(--teal); }
.delta.up { color: var(--amber); }
.empty { color: var(--muted); font-size: .92rem; padding: 6px 0; }
.hint { font-size: .82rem; color: var(--muted); }
.disclaimer { font-size: .8rem; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; }

.cta { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 14px; padding: 15px 18px; font-weight: 700; font-size: 1rem; width: 100%; }
.btn { background: var(--surface2); color: var(--fg); border: 0; border-radius: 12px; padding: 11px 14px; font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid currentColor; }
.btn.wide { width: 100%; }
.ghost { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 8px 0; }
.link-danger { background: none; border: 0; color: var(--danger); font-weight: 600; padding: 10px 0; align-self: center; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }

label { font-size: .82rem; font-weight: 600; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
input, select, textarea {
  width: 100%; min-width: 0; background: var(--surface2); border: 1px solid transparent; border-radius: 12px; padding: 11px 12px; font-size: 16px;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; background: var(--surface); }
textarea { min-height: 70px; resize: vertical; }
.fields2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fields3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

/* ---------- Hoje ---------- */
.hello { padding-top: 10px; display: flex; flex-direction: column; gap: 4px; }
.hello h1 { font-size: 2.2rem; }
.next { background: var(--fg); color: var(--bg); }
.next .eyebrow, .next .muted { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.next h2 { font-size: 1.9rem; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
.week div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: .72rem; color: var(--muted); font-weight: 600; }
.week i { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-style: normal; }
.week .done i { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.week .today { color: var(--fg); }
.week .today i { border-color: var(--fg); }
.kcal-trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kcal-trio div { display: flex; flex-direction: column; gap: 2px; }
.kcal-trio strong { font-family: var(--font-d); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.bar b { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.over b { background: var(--amber); }
.tile-link { text-align: left; border: 0; font: inherit; color: inherit; }

/* ---------- Fichas ---------- */
.ficha { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; }
.letter {
  width: 52px; height: 52px; border-radius: 14px; background: var(--accent-soft); color: var(--accent);
  font-family: var(--font-d); font-weight: 800; font-size: 1.7rem; display: grid; place-items: center;
}
.ficha .body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ficha .list { font-size: .88rem; color: var(--muted); }
.ficha .row { margin-top: 6px; }
.hist { display: flex; flex-direction: column; }
.hist button { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 0; }
.hist button:last-child { border-bottom: 0; }
.hist .sub { font-size: .84rem; color: var(--muted); grid-column: 1; }
.hist .right { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }

/* ---------- Sessão de treino ---------- */
.sess-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 8px; }
.crono { font-family: var(--font-d); font-size: 1.5rem; font-variant-numeric: tabular-nums; font-weight: 700; }
.ex h3 { font-size: 1.15rem; }
.ex .meta { font-size: .84rem; color: var(--muted); }
.series { display: flex; flex-direction: column; gap: 6px; }
.serie { display: grid; grid-template-columns: 28px 1fr 1fr 48px; gap: 8px; align-items: center; }
.serie .n { font-weight: 700; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.serie input { text-align: center; font-variant-numeric: tabular-nums; padding: 10px 6px; }
.serie-h { display: grid; grid-template-columns: 28px 1fr 1fr 48px; gap: 8px; font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; text-align: center; }
.ok-btn { height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.ok-btn svg { width: 22px; height: 22px; stroke: var(--muted); fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.serie.ok .ok-btn { background: var(--teal); border-color: var(--teal); }
.serie.ok .ok-btn svg { stroke: var(--surface); }
.serie.ok input { background: var(--teal-soft); }
.ex-actions { display: flex; justify-content: space-between; }
.ex-actions button { background: none; border: 0; color: var(--muted); font-weight: 600; font-size: .86rem; padding: 4px 0; }

/* ---------- Timer ---------- */
.timer {
  position: fixed; z-index: 24; left: 0; right: 0;
  bottom: calc(66px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.timer .box {
  max-width: 528px; margin: 0 auto; background: var(--fg); color: var(--bg); border-radius: 18px; padding: 12px 14px;
  display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.25);
}
.timer .t { display: flex; flex-direction: column; }
.timer .t span { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; opacity: .7; font-weight: 700; }
.timer .t strong { font-family: var(--font-d); font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
.timer button { background: color-mix(in srgb, var(--bg) 16%, transparent); color: var(--bg); border: 0; border-radius: 10px; padding: 10px 12px; font-weight: 700; }
.timer.done .box { background: var(--teal); color: var(--surface); }
.timer.done button { color: var(--surface); }
.timer .prog { grid-column: 1 / -1; height: 4px; border-radius: 9px; background: color-mix(in srgb, var(--bg) 18%, transparent); overflow: hidden; }
.timer .prog b { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s linear; }

/* ---------- Diário ---------- */
.daynav { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; text-align: center; gap: 8px; }
.daynav button { height: 44px; border-radius: 12px; border: 0; background: var(--surface); box-shadow: var(--shadow); font-size: 1.3rem; }
.daynav button:disabled { opacity: .35; }
.daynav strong { font-family: var(--font-d); font-size: 1.1rem; }
.meal { display: flex; flex-direction: column; gap: 4px; }
.meal h3 { font-size: .9rem; font-family: var(--font-b); font-weight: 700; display: flex; justify-content: space-between; }
.meal h3 span { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.item { display: grid; grid-template-columns: 1fr auto 32px; gap: 8px; align-items: center; font-size: .93rem; padding: 4px 0; }
.item .k { font-variant-numeric: tabular-nums; color: var(--muted); }
.x { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--surface2); color: var(--muted); font-size: 1rem; line-height: 1; }
.addmeal { display: grid; grid-template-columns: 1fr 90px; gap: 8px; }
.addmeal select { grid-column: 1 / -1; }
.addmeal button { grid-column: 1 / -1; }

/* ---------- Mounjaro ---------- */
.mj-hero { background: var(--teal-soft); box-shadow: none; }
.mj-hero .big { color: var(--teal); }
.mj-hero.late { background: var(--amber-soft); }
.mj-hero.late .big { color: var(--amber); }
.mj-hero.today { background: var(--accent-soft); }
.mj-hero.today .big { color: var(--accent); }
.doses { display: flex; gap: 6px; flex-wrap: wrap; }
.doses label { flex: 1 0 auto; }
.doses input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.doses span { display: block; text-align: center; padding: 10px 6px; border-radius: 10px; background: var(--surface2); color: var(--fg); font-weight: 700; font-variant-numeric: tabular-nums; font-size: .9rem; min-width: 52px; }
.doses input:checked + span { background: var(--accent); color: var(--accent-ink); }
.doses input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Charts ---------- */
.chart { overflow-x: auto; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--font-b); font-variant-numeric: tabular-nums; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.chart .line.teal { stroke: var(--teal); }
.chart .area { fill: var(--accent); opacity: .1; }
.chart .area.teal { fill: var(--teal); }
.chart .dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2.4; }
.chart .dot.teal { stroke: var(--teal); }
.chart .end { fill: var(--fg); font-weight: 700; font-size: 11px; }
.chart .mk { fill: var(--teal); }
.chart .barv { fill: var(--accent); }
.chart .barg { fill: var(--teal); }
.chart .meta-line { stroke: var(--amber); stroke-dasharray: 4 3; stroke-width: 1.4; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .78rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats3 div { display: flex; flex-direction: column; gap: 2px; }
.stats3 strong { font-family: var(--font-d); font-size: 1.3rem; font-variant-numeric: tabular-nums; }

/* ---------- Sheet ---------- */
.sheet { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet-bg { position: absolute; inset: 0; background: rgba(20, 8, 18, .45); border: 0; }
.sheet-card {
  position: relative; background: var(--bg); border-radius: 22px 22px 0 0; max-height: 92vh; overflow-y: auto;
  width: 100%; max-width: 600px; margin: 0 auto;
  padding-top: 10px; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
  animation: up .22s ease-out;
}
.sheet-x { position: absolute; top: 12px; right: max(14px, env(safe-area-inset-right, 0px)); width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--surface2); color: var(--muted); font-size: 1.3rem; line-height: 1; }
.sheet-card > h2 { padding-right: 44px; }
.sheet-card::before { content: ""; width: 40px; height: 5px; border-radius: 9px; background: var(--line); align-self: center; }
@keyframes up { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
.ex-edit { background: var(--surface); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.ex-edit .top-row { display: grid; grid-template-columns: 1fr 36px; gap: 8px; }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: .92rem; }
.steps b { font-weight: 700; }
.sheet .acct { display: flex; gap: 12px; align-items: center; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; z-index: 50; left: 50%; transform: translateX(-50%);
  bottom: calc(90px + env(safe-area-inset-bottom, 0px));
  background: var(--fg); color: var(--bg); padding: 11px 18px; border-radius: 999px; font-weight: 600; font-size: .92rem;
  max-width: calc(100% - 32px); text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.2);
}

@media (max-width: 360px) {
  .grid2 { grid-template-columns: 1fr; }
  h1 { font-size: 1.6rem; }
}
@media (prefers-reduced-motion: reduce) {
  .sheet-card { animation: none; }
  .timer .prog b { transition: none; }
}

/* ---------- Busca de alimentos ---------- */
.addfood { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.sugs { display: flex; flex-direction: column; }
.sugs:empty { display: none; }
.sugs button { display: flex; justify-content: space-between; gap: 10px; text-align: left; background: var(--surface2); border: 0; padding: 11px 12px; border-bottom: 1px solid var(--line); }
.sugs button:first-child { border-radius: 12px 12px 0 0; }
.sugs button:last-child { border-radius: 0 0 12px 12px; border-bottom: 0; }
.sugs button:only-child { border-radius: 12px; }
.sugs button .hint { white-space: nowrap; font-variant-numeric: tabular-nums; }
.sugs .manual span:first-child { color: var(--accent); font-weight: 600; }
.selbox { display: flex; flex-direction: column; gap: 10px; background: var(--accent-soft); border-radius: 14px; padding: 12px; }
.selbox input, .selbox select { background: var(--surface); }
.qtyrow { display: grid; grid-template-columns: 90px 1fr; gap: 8px; }
.qtyrow input { text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; }
.kcalout { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
.kcalout input { font-family: var(--font-d); font-size: 1.3rem; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
.check { display: flex; gap: 8px; align-items: center; font-weight: 500; color: var(--fg); font-size: .9rem; }

/* ---------- Importar ---------- */

/* ---------- Demonstrações ---------- */
.demo { display: flex; flex-direction: column; gap: 8px; margin: -6px -6px 0; }

.demo-svg .fig.f2 { opacity: .4; }
.demo-svg .cabeca { fill: var(--fg); }
.demo-svg .chao { stroke: var(--line); stroke-width: 1.5; }
.demo-svg .eq { stroke: var(--muted); stroke-width: 2.6; stroke-linecap: round; fill: none; }
.demo-svg .eq.thin { stroke-width: 1.4; }
.demo-svg .cabo { stroke: var(--muted); stroke-width: .9; stroke-dasharray: 2 2; }
.demo-svg .peso { fill: var(--accent); }
.demo-svg .peso-in { fill: var(--surface2); }
.demo-svg .demo-lbl { fill: var(--muted); font-size: 8px; font-family: var(--font-b); font-weight: 600; }
.dicas { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; font-size: .86rem; color: var(--muted); }
.video { font-size: .86rem; font-weight: 700; color: var(--accent); text-decoration: none; align-self: flex-start; }
.nodemo { background: var(--surface2); border-radius: 14px; padding: 12px; margin: 0; }
.demo-toggle { align-self: flex-start; padding: 0; font-size: .9rem; }

/* ---------- Strava e avisos ---------- */
.chip.strava { background: var(--strava-soft); color: var(--strava); }
.strava-btn { background: var(--strava); color: #fff; }
.ativ { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 4px 0; }
.ativ .chip { min-width: 84px; justify-content: center; margin-top: 2px; }
.ativ div { min-width: 0; }
.aviso { border: 2px solid var(--accent-soft); box-shadow: none; }
.aviso.mj { border-color: var(--teal-soft); background: var(--teal-soft); gap: 4px; }
.aviso.mj strong { color: var(--teal); font-family: var(--font-d); font-size: 1.15rem; }
.peso-rapido { grid-template-columns: 1fr auto; }
.peso-rapido input { font-family: var(--font-d); font-size: 1.3rem; }
.btn:disabled { opacity: .45; }

/* =====================================================================
   Camada visual Apple — refinamentos de componentes (somente apresentação)
   ===================================================================== */
body { font-size: 17px; line-height: 1.47; letter-spacing: -0.012em; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
h1, h2, h3 { letter-spacing: -0.022em; }
h1 { font-size: 2.125rem; font-weight: 700; line-height: 1.12; }
h2 { font-size: 1.375rem; font-weight: 600; }
h3 { font-size: 1.0625rem; font-weight: 600; }
.eyebrow { font-size: .8125rem; font-weight: 500; letter-spacing: .01em; text-transform: uppercase; color: var(--muted); }
.sec { font-size: .8125rem; font-weight: 500; letter-spacing: .01em; padding: 12px 4px 0; }
.hint, .empty { font-size: .875rem; }
.big { font-weight: 600; letter-spacing: -0.025em; font-size: 2.25rem; }
.kcal-trio strong, .stats3 strong { font-weight: 600; letter-spacing: -0.02em; }
main { gap: 20px; }

/* barra de título e tab bar translúcidas */
.top { background: var(--glass); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); padding-block: 10px; }
.brand { font-weight: 600; font-size: 1.0625rem; letter-spacing: -0.02em; }
.brand span { color: var(--muted); font-style: normal; font-weight: 400; }
.avatar { width: 34px; height: 34px; border: 0; background: var(--surface2); color: var(--accent); font-weight: 600; font-size: .95rem; }
.tabs { background: var(--tabglass); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--line); padding-top: 4px; }
.tabs button { font-size: .625rem; font-weight: 500; letter-spacing: .01em; gap: 3px; transition: color .2s var(--ease); }
.tabs svg { width: 25px; height: 25px; stroke-width: 1.6; }

/* cartões */
.card { border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); gap: 14px; }
.demo-flag { background: var(--surface); color: var(--muted); border-radius: 14px; padding: 10px 14px; font-size: .8125rem; box-shadow: var(--shadow); }
.next { background: var(--surface); color: var(--fg); }
.next .eyebrow, .next .muted { color: var(--muted); }
.next h2 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.025em; }
.tile-link { transition: transform .25s var(--ease); }
.tile-link:active { transform: scale(.985); }

/* botões */
.cta, .btn, .ghost, .x, .ok-btn, .sheet-x, .daynav button, .timer button, .sugs button, .hist button { transition: transform .15s var(--ease), background-color .2s var(--ease), opacity .2s; }
.cta { border-radius: 14px; padding: 15px 20px; font-weight: 600; font-size: 1.0625rem; letter-spacing: -0.01em; }
.cta:active, .btn:active { transform: scale(.97); opacity: .9; }
.btn { background: var(--surface2); color: var(--accent); border-radius: 12px; padding: 11px 16px; font-weight: 500; font-size: .9375rem; }
.btn.primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { background: var(--danger-soft); color: var(--danger); border: 0; }
.ghost { font-weight: 500; font-size: 1rem; }
.ghost:active, .link-danger:active { opacity: .5; }
.link-danger { font-weight: 500; }
.strava-btn { background: var(--strava); color: #fff; }
.btn-google { background: var(--fg); color: var(--bg); border-radius: 14px; font-weight: 600; font-size: 1.0625rem; padding: 16px 22px; }

/* chips e badges */
.chip { font-weight: 500; font-size: .75rem; padding: 3px 10px; }

/* campos */
label { font-size: .8125rem; font-weight: 500; }
input, select, textarea { background: var(--surface2); border: 1px solid transparent; border-radius: 10px; padding: 12px 13px; transition: box-shadow .2s var(--ease), border-color .2s var(--ease), background-color .2s; }
input:focus, select:focus, textarea:focus { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
select { -webkit-appearance: none; appearance: none; padding-right: 36px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 52%, calc(100% - 13px) 52%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
.check input { width: 22px; height: 22px; }

/* Hoje */
.hello { gap: 2px; padding-top: 14px; }
.hello h1 { font-size: 2.125rem; }
.week i { border-width: 1.5px; width: 30px; height: 30px; font-size: .8rem; }
.week .done i { background: var(--accent); border-color: var(--accent); }
.bar { height: 6px; }

/* fichas e histórico */
.letter { border-radius: 12px; font-weight: 600; font-size: 1.5rem; width: 48px; height: 48px; }
.hist button { border-bottom: .5px solid var(--line); padding: 13px 0; }
.hist button:active { opacity: .6; }
.hist .right { font-weight: 600; }

/* sessão de treino */
.crono { font-weight: 600; font-size: 1.375rem; color: var(--muted); }
.serie input { border-radius: 10px; font-weight: 500; }
.ok-btn { border-radius: 999px; border: 1.5px solid var(--line); width: 44px; justify-self: center; }
.ok-btn svg { stroke-width: 2.4; }
.ok-btn:active { transform: scale(.9); }
.serie.ok .ok-btn { background: var(--teal); border-color: var(--teal); }
.ex-actions button { color: var(--accent); font-weight: 500; }

/* timer: cápsula escura */
.timer .box { border-radius: 24px; padding: 12px 14px 12px 20px; box-shadow: 0 12px 40px rgba(0, 0, 0, .22); }
.timer .t span { font-weight: 500; letter-spacing: .04em; }
.timer .t strong { font-weight: 600; letter-spacing: -0.02em; }
.timer button { border-radius: 999px; padding: 9px 14px; font-weight: 600; }

/* diário */
.daynav button { border-radius: 999px; width: 44px; color: var(--accent); background: var(--surface); }
.daynav strong { font-weight: 600; font-size: 1.0625rem; }
.meal h3 { font-weight: 600; font-size: .9375rem; }
.x { background: var(--surface2); font-size: .95rem; }
.sugs button { background: var(--surface); border-bottom: .5px solid var(--line); padding: 12px 14px; }
.sugs { border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 .5px var(--line), var(--shadow); }
.sugs button:active { background: var(--surface2); }
.selbox { border-radius: 16px; padding: 14px; }
.kcalout input { font-weight: 600; }

/* Mounjaro: dose como controle segmentado */
.mj-hero { box-shadow: none; }
.mj-hero .big { font-weight: 700; }
.doses { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface2); padding: 3px; border-radius: 10px; gap: 2px; }
.doses span { background: transparent; border-radius: 8px; font-weight: 500; padding: 8px 4px; transition: background-color .2s var(--ease), box-shadow .2s var(--ease); }
.doses input:checked + span { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 0, 0, .04); }

/* gráficos */
.chart .line { stroke-width: 2.2; }
.chart .area { opacity: .08; }

/* sheet (modal) */
.sheet-bg { background: rgba(0, 0, 0, .32); }
.sheet-card { border-radius: 14px 14px 0 0; gap: 16px; padding-top: 8px; animation: up .42s var(--ease); }
.sheet-card::before { width: 36px; height: 5px; background: var(--line); }
.sheet-x { width: 30px; height: 30px; font-size: 1.1rem; color: var(--muted); }
@keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }

/* toast tipo HUD */
.toast { border-radius: 14px; font-weight: 500; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); background: color-mix(in srgb, var(--fg) 88%, transparent); animation: hud .3s var(--ease); }
@keyframes hud { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* login */
.wordmark { font-weight: 700; letter-spacing: -0.035em; font-size: clamp(2.6rem, 13vw, 3.6rem); line-height: 1.02; }
.wordmark span { color: var(--muted); font-style: normal; font-weight: 400; }
.login .lead { font-size: 1.1875rem; line-height: 1.4; }
.login .note { border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }

/* demonstrações, Strava e avisos */
.demo-svg { border-radius: 16px; }
.demo-svg .fig { stroke-width: 3; }
.video { font-weight: 500; }
.aviso { border: 0; box-shadow: var(--shadow); }
.aviso.mj { box-shadow: none; }
.aviso.mj strong { font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  .toast, .sheet-card { animation: none; }
  .cta:active, .btn:active, .tile-link:active, .ok-btn:active { transform: none; }
}

/* =====================================================================
   Tema claro obrigatório — nenhuma superfície escura
   ===================================================================== */
input, select, textarea { background-color: var(--field); border: 1px solid var(--line); }
input:focus, select:focus, textarea:focus { background-color: var(--field); }
.selbox input, .selbox select, .serie input { background-color: var(--field); }
.serie.ok input { background-color: var(--teal-soft); border-color: transparent; }
.doses { border: 1px solid var(--line); }
.btn-google { background: var(--surface); color: var(--fg); border: 1px solid var(--line); box-shadow: var(--shadow); }
.timer .box { background: var(--surface); color: var(--fg); border: 1px solid var(--line); box-shadow: 0 8px 30px rgba(0, 0, 0, .10); }
.timer .t span { color: var(--muted); opacity: 1; }
.timer button { background: var(--surface2); color: var(--accent); border: 1px solid var(--line); }
.timer .prog { background: var(--surface2); }
.timer.done .box { background: var(--teal-soft); color: var(--teal); border-color: var(--teal-soft); }
.timer.done button { background: var(--surface); color: var(--teal); }
.toast { background: rgba(255, 255, 255, .92); color: var(--fg); border: 1px solid var(--line); box-shadow: 0 8px 28px rgba(0, 0, 0, .12); }
.sheet-bg { background: rgba(29, 29, 31, .18); }
.sheet-card { background: var(--bg); }
.hist button, .sugs button { border-bottom-color: var(--line); }
.ex-edit { border: 1px solid var(--line); }

/* ---------- Meta de calorias ---------- */
.meta-res { display: grid; grid-template-columns: 1fr; gap: 12px; background: var(--accent-soft); border-radius: 16px; padding: 16px; }
.meta-res > div:first-child { display: flex; flex-direction: column; gap: 2px; }
.meta-res strong { font-size: 2rem; font-weight: 700; letter-spacing: -0.025em; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1.05; }
.meta-res strong small { font-size: .9rem; font-weight: 500; color: var(--muted); }
.meta-linhas { display: flex; flex-direction: column; gap: 4px; font-size: .8125rem; min-width: 0; }
.meta-linhas p { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); }
.meta-linhas b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.meta-linhas { border-top: 1px solid rgba(0, 113, 227, .15); padding-top: 10px; font-size: .875rem; }

/* ---------- Cardio ---------- */
.cardio .orient { font-size: .9375rem; color: var(--fg); background: var(--teal-soft); border-radius: 12px; padding: 10px 12px; margin-top: 8px; }
.cardio-timer { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--surface2); border-radius: 14px; padding: 12px 14px; }
.cardio-timer strong { font-size: 2.25rem; font-weight: 600; letter-spacing: -0.02em; }
.segmented { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.segmented button { border: 0; background: transparent; border-radius: 8px; padding: 8px 4px; font-weight: 500; color: var(--fg); transition: background-color .2s var(--ease), box-shadow .2s var(--ease); }
.segmented button.on { background: var(--surface); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.btn.ok-cardio { background: var(--teal-soft); color: var(--teal); font-weight: 600; }
.cardio.feito { box-shadow: 0 0 0 2px var(--teal-soft), var(--shadow); }
.cardio-edit { border-color: var(--teal-soft); }
.tipo-chip { align-self: flex-start; padding: 8px 12px; }
.semana-atual { font-size: 1.0625rem; font-weight: 600; padding: 12px 0; }

/* ---------- Macros ---------- */
:root { --prot: #0071e3; --carb: #ff9500; --gord: #af52de; }
.macros { display: flex; flex-direction: column; gap: 12px; }
.macro { display: flex; flex-direction: column; gap: 6px; font-size: .9375rem; }
.macro b { font-weight: 600; }
.bar.prot b { background: var(--prot); }
.bar.carb b { background: var(--carb); }
.bar.gord b { background: var(--gord); }
.bar.over b { background: var(--amber); }
.macros-mini { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8125rem; color: var(--muted); }
.macros-mini b { color: var(--fg); font-weight: 600; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.dot.prot { background: var(--prot); } .dot.carb { background: var(--carb); } .dot.gord { background: var(--gord); }
.macro-sel { display: flex; gap: 6px; flex-wrap: wrap; }
.mchip { font-size: .8125rem; background: var(--surface); border-radius: 999px; padding: 4px 10px; color: var(--muted); border: 1px solid var(--line); }
.mchip b { color: var(--fg); font-weight: 600; }
.mchip.prot { border-color: color-mix(in srgb, var(--prot) 35%, transparent); }
.mchip.carb { border-color: color-mix(in srgb, var(--carb) 40%, transparent); }
.mchip.gord { border-color: color-mix(in srgb, var(--gord) 35%, transparent); }
.meal-tot { padding-top: 2px; }

/* ---------- Frase motivacional ---------- */
.frase { position: relative; text-align: left; border: 0; gap: 6px; padding: 22px 22px 16px; overflow: hidden; --fc: var(--accent); --fs: var(--accent-soft); background: linear-gradient(135deg, var(--fs), var(--surface) 75%); }
.frase.f-rosa { --fc: #e0306a; --fs: #fde8ef; }
.frase.f-verde { --fc: #248a3d; --fs: #e5f5e9; }

.frase-dica { color: var(--fc); font-weight: 500; font-size: .8125rem; }
.frase:active { transform: scale(.985); }

</style>

'use strict';
/* =====================================================================
   AMANDINHA FITNESS — configuração

const store = {
  mode: 'local', uid: 'demo', fs: null, user: null,
  key(c) { return `af:${this.uid}:${c}`; },
  ref(c) { return this.fs.collection('users').doc(this.uid).collection(c); },
  async loadAll() {
    for (const c of COLS) {
      try {
        if (this.mode === 'cloud') {
          const snap = await this.ref(c).get();
          S[c] = snap.docs.map(d => ({ ...d.data(), id: d.id }));
        } else {
          S[c] = Object.entries(lsGet(this.key(c), {})).map(([id, v]) => ({ ...v, id }));
        }
      } catch (e) { console.error(e); S[c] = []; }
    }
  },
  put(c, item) {
    item = JSON.parse(JSON.stringify(item));
    const i = S[c].findIndex(x => x.id === item.id);
    if (i >= 0) S[c][i] = item; else S[c].push(item);
    const { id, ...data } = item;
    if (this.mode === 'cloud') {
      this.ref(c).doc(id).set(data).catch(e => { console.error(e); toast('Não consegui salvar na nuvem. Confira a internet.'); });
    } else {
      const o = lsGet(this.key(c), {}); o[id] = data;
      if (!lsSet(this.key(c), o)) toast('Não consegui salvar neste aparelho.');
    }
    return item;
  },
  del(c, id) {
    S[c] = S[c].filter(x => x.id !== id);
    if (this.mode === 'cloud') {
      this.ref(c).doc(id).delete().catch(e => { console.error(e); toast('Não consegui apagar na nuvem.'); });
    } else {
      const o = lsGet(this.key(c), {}); delete o[id]; lsSet(this.key(c), o);
    }
  }
};

/* ---------------- gráficos ---------------- */
function lineChart(pts, o = {}) {
  if (pts.length < 2) return `<p class="empty">${o.vazio || 'Registre pelo menos dois dias para ver o gráfico.'}</p>`;
  const W = 340, H = 170, L = 38, R = 14, T = 16, B = 26, cls = o.teal ? ' teal' : '';
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = (y1 - y0) * 0.18 || Math.max(1, y1 * 0.05); y0 -= pad; y1 += pad;
  const sx = x => L + (x - x0) / ((x1 - x0) || 1) * (W - L - R);
  const sy = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  let g = '';
  [0.15, 0.5, 0.85].forEach(k => {
    const v = y0 + (y1 - y0) * k, y = sy(v);
    g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text x="${L - 6}" y="${(y + 3).toFixed(1)}" text-anchor="end">${fmt1(v)}</text>`;
  });
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join('');
  const area = `${d}L${sx(x1).toFixed(1)},${H - B}L${sx(x0).toFixed(1)},${H - B}Z`;
  const last = pts[pts.length - 1];
  let mk = '';
  (o.markers || []).forEach(m => { if (m >= x0 && m <= x1) { const x = sx(m); mk += `<path class="mk" d="M${(x - 4).toFixed(1)},${H - B + 1}L${(x + 4).toFixed(1)},${H - B + 1}L${x.toFixed(1)},${H - B - 6}Z"/>`; } });
  const lx = sx(last.x), ly = sy(last.y);
  const anchor = lx > W - 60 ? 'end' : 'middle';
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'Gráfico')}">
    ${g}<path class="area${cls}" d="${area}"/><path class="line${cls}" d="${d}"/>${mk}
    <circle class="dot${cls}" cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4.5"/>
    <text class="end" x="${(anchor === 'end' ? lx : lx).toFixed(1)}" y="${(ly - 10).toFixed(1)}" text-anchor="${anchor}">${fmt1(last.y)}${o.unit ? ' ' + o.unit : ''}</text>
    <text x="${L}" y="${H - 6}">${o.xfmt ? o.xfmt(x0) : ''}</text>
    <text x="${W - R}" y="${H - 6}" text-anchor="end">${o.xfmt ? o.xfmt(x1) : ''}</text>
  </svg></div>`;
}
function barChart(days, meta) {
  const W = 340, H = 160, L = 34, R = 8, T = 12, B = 22;
  const max = Math.max(meta || 0, ...days.map(d => Math.max(d.c, d.g)), 100) * 1.1;
  const sy = v => T + (1 - v / max) * (H - T - B);
  const bw = (W - L - R) / days.length;
  let s = '';
  [0.5, 1].forEach(k => { const v = Math.round(max * k / 1.1 / 100) * 100; const y = sy(v); s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text x="${L - 5}" y="${(y + 3).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`; });
  days.forEach((d, i) => {
    const x = L + i * bw, w = Math.max(3, bw / 2 - 2);
    if (d.c) s += `<rect class="barv" x="${(x + 1).toFixed(1)}" y="${sy(d.c).toFixed(1)}" width="${w.toFixed(1)}" height="${(H - B - sy(d.c)).toFixed(1)}" rx="2"/>`;
    if (d.g) s += `<rect class="barg" x="${(x + 1 + w + 1).toFixed(1)}" y="${sy(d.g).toFixed(1)}" width="${w.toFixed(1)}" height="${(H - B - sy(d.g)).toFixed(1)}" rx="2"/>`;
    if (i % 2 === (days.length - 1) % 2) s += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${d.label}</text>`;
  });
  if (meta) { const y = sy(meta); s += `<line class="meta-line" x1="${L}" x2="${W - R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/>`; }
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calorias por dia">${s}</svg></div>`;
}

        ${lineChart(exPts, { unit: 'kg', label: 'Carga máxima de ' + exSel, xfmt: x => ddmm(localISO(new Date(x))), vazio: 'Faça esse exercício em pelo menos dois treinos para ver a evolução.' })}`

/* ---------------- sessão de treino ---------------- */
function iniciar(fid) {
  if (sessao) { aba = 'treino'; render(true); return; }
  const f = S.fichas.find(x => x.id === fid); if (!f) return;
  sessao = {
    fichaId: f.id, fichaNome: f.nome, inicio: new Date().toISOString(),
    exercicios: f.exercicios.filter(e => e.nome.trim()).map(e => {
      if (e.tipo === 'cardio') return cardioParaSessao(e);
      const ult = ultimoDoExercicio(e.nome);
      const n = Math.max(1, num(e.series) || 3);
      const repsPadrao = (String(e.reps || '').match(/\d+/) || [''])[0];
      return {
        nome: e.nome, reps: e.reps, descanso: num(e.descanso) || 60,
        ultima: ult ? resumoSeries(ult.series) : '',
        series: Array.from({ length: n }, (_, i) => ({
          carga: ult ? String((ult.series[i] || ult.series[ult.series.length - 1]).carga).replace('.', ',') : '',
          reps: ult ? (ult.series[i] || ult.series[ult.series.length - 1]).reps : repsPadrao,
          feito: false
        }))
      };
    })
  };
  salvarSessao(); aba = 'treino'; render(true); pedirWakeLock();
}

function resumoSeries(ss) {
  const igual = ss.every(x => x.carga === ss[0].carga && x.reps === ss[0].reps);
  return 'Última vez: ' + (igual ? `${ss.length}×${ss[0].reps} com ${fmt1(num(ss[0].carga) || 0)} kg` : ss.map(x => `${fmt1(num(x.carga) || 0)}kg×${x.reps}`).join(' · '));
}
let wl = null;
async function pedirWakeLock() { try { if (navigator.wakeLock) wl = await navigator.wakeLock.request('screen'); } catch (e) { /* ok */ } }
function soltarWakeLock() { try { wl && wl.release(); } catch (e) { } wl = null; }
document.addEventListener('visibilitychange', () => { if (sessao && document.visibilityState === 'visible') pedirWakeLock(); });

/* timer de descanso */
let timerEnd = 0, timerTotal = 0, timerInt = null, actx = null;
function destravarAudio() {
  try {
    if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); }
    if (actx && actx.state === 'suspended') actx.resume();
  } catch (e) { }
}
function bip() {
  if (!actx) return;
  try {
    [0, 0.28, 0.56].forEach(t => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      const s = actx.currentTime + t;
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.35, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.2);
      o.start(s); o.stop(s + 0.22);
    });
  } catch (e) { }
}
function iniciarTimer(seg) {
  timerTotal = seg; timerEnd = Date.now() + seg * 1000;
  const el = $('#timer'); el.hidden = false; el.classList.remove('done');
  $('#timer-pular').textContent = 'Pular';
  $('#view').classList.add('has-timer');
  clearInterval(timerInt); timerInt = setInterval(tickTimer, 250); tickTimer();
}
function tickTimer() {
  const left = Math.max(0, Math.ceil((timerEnd - Date.now()) / 1000));
  $('#timer-txt').textContent = mmss(left);
  $('#timer-prog').style.width = (timerTotal ? (1 - left / timerTotal) * 100 : 100).toFixed(1) + '%';
  if (left <= 0) {
    clearInterval(timerInt); timerInt = null;
    const el = $('#timer'); el.classList.add('done');
    $('#timer-txt').textContent = 'Bora!';
    $('#timer-pular').textContent = 'OK';
    bip(); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) { }
    setTimeout(() => { if (!timerInt) fecharTimer(); }, 8000);
  }
}
function fecharTimer() { clearInterval(timerInt); timerInt = null; $('#timer').hidden = true; $('#view').classList.remove('has-timer'); }

function finalizarSheet() {
  const min = Math.max(1, Math.round((Date.now() - new Date(sessao.inicio)) / 60000));
  const feitas = sessao.exercicios.reduce((s, e) => s + (e.series || []).filter(x => x.feito).length + (e.tipo === 'cardio' && e.feito ? 1 : 0), 0);

}
function salvarTreino(f) {
  const s = sessao;
  const t = {
    id: novoId(), fichaId: s.fichaId, fichaNome: s.fichaNome, inicio: s.inicio, fim: new Date().toISOString(),
    data: localISO(new Date(s.inicio)),

    fcMedia: num(f.querySelector('#f-fc').value), obs: f.querySelector('#f-obs').value.trim(),

  };
  store.put('treinos', t);
  sessao = null; lsSet(sessKey(), null); soltarWakeLock(); fecharTimer(); fecharSheet();

}

async function entrar() {
  if (!firebaseOk()) { store.mode = 'local'; store.uid = 'demo'; store.user = null; await abrirApp(); return; }
  const prov = new firebase.auth.GoogleAuthProvider();
  prov.setCustomParameters({ prompt: 'select_account' });
  try { await firebase.auth().signInWithPopup(prov); }
  catch (e) {
    if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/cancelled-popup-request'].includes(e.code)) {
      try { await firebase.auth().signInWithRedirect(prov); } catch (e2) { mostrarLogin('Não consegui abrir o login do Google. Tente de novo.'); }
    } else if (e.code !== 'auth/popup-closed-by-user') {
      mostrarLogin('Não consegui entrar: ' + (e.message || e.code));
    }
  }
}

function iniciarApp() {
  if (!firebaseOk()) { mostrarLogin(); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  const fs = firebase.firestore();
  fs.enablePersistence({ synchronizeTabs: true }).catch(() => { });
  firebase.auth().getRedirectResult().catch(e => mostrarLogin('Não consegui entrar: ' + (e.message || e.code)));
  firebase.auth().onAuthStateChanged(async (u) => {
    if (!u) { mostrarLogin(); return; }
    if (EMAILS_PERMITIDOS.length && !EMAILS_PERMITIDOS.map(x => x.toLowerCase()).includes((u.email || '').toLowerCase())) {
      await firebase.auth().signOut();
      mostrarLogin(`A conta ${u.email} não tem acesso a este app.`);
      return;
    }
    store.mode = 'cloud'; store.uid = u.uid; store.user = u; store.fs = fs;
    await abrirApp();
  });
}


/* =====================================================================
   META DE CALORIAS — sempre calculada para perda de peso
   TMB (Mifflin-St Jeor) × nível de atividade = gasto estimado do dia.
   Meta = gasto − déficit do ritmo escolhido, com dois limites de
   segurança: déficit de no máximo 25% do gasto, e meta nunca abaixo
   da TMB nem de 1.200 kcal.
   ===================================================================== */
const ATIVIDADES = [['1.2', 'Sedentária · quase sem treino'], ['1.375', 'Leve · 1 a 3x/semana'], ['1.55', 'Moderada · 3 a 5x/semana'], ['1.725', 'Alta · 6 a 7x/semana']];
const RITMOS = [['300', 'Suave · ~0,3 kg/semana'], ['500', 'Moderado · ~0,5 kg/semana'], ['750', 'Acelerado · ~0,7 kg/semana']];

function idadeDe(nasc) {
  if (!nasc) return null;
  const n = new Date(nasc + 'T12:00:00'), h = new Date();
  let i = h.getFullYear() - n.getFullYear();
  if (h.getMonth() < n.getMonth() || (h.getMonth() === n.getMonth() && h.getDate() < n.getDate())) i--;
  return i > 0 && i < 120 ? i : null;
}
function metaCalc() {
  const p = cfg();
  const ps = pesos(); const peso = ps.length ? ps[ps.length - 1].peso : null;
  const altura = num(p.altura), idade = idadeDe(p.nascimento), sexo = p.sexo || 'f';
  const falta = [];
  if (!peso) falta.push('peso (registre no Diário)');
  if (!altura) falta.push('altura');
  if (!idade) falta.push('data de nascimento');
  if (falta.length) return { falta };
  const tmb = 10 * peso + 6.25 * altura - 5 * idade + (sexo === 'm' ? 5 : -161);
  const fator = num(p.atividade) || 1.375;
  const gasto = tmb * fator;
  const ritmo = num(p.ritmo) || 500;
  const deficit = Math.min(ritmo, gasto * 0.25);
  const piso = Math.max(tmb, 1200);
  const meta = Math.max(gasto - deficit, piso);
  const deficitReal = gasto - meta;
  return {
    peso, altura, idade, tmb: Math.round(tmb), gasto: Math.round(gasto), meta: Math.round(meta / 10) * 10,
    deficit: Math.round(deficitReal), kgSemana: deficitReal * 7 / 7700, limitado: meta === piso && gasto - ritmo < piso
  };
}
const metaDiaria = () => metaCalc().meta || null;
// Metas de macros para perda de peso preservando músculo:
// proteína 1,6 g por kg (do peso-meta, ou do peso atual se não houver meta e ele for menor),
// gordura 25% das calorias, carboidratos com o restante.
function metaMacros() {
  const m = metaCalc(); if (!m.meta) return null;
  const ref = num(cfg().metaPeso) || m.peso;
  const p = Math.round(1.6 * Math.min(ref, m.peso));
  const g = Math.round(m.meta * 0.25 / 9);
  const c = Math.max(50, Math.round((m.meta - p * 4 - g * 9) / 4));
  return { p, c, g };
}

function metaCalcHTML() {
  const m = metaCalc();
  if (m.falta) return `<p class="hint">Para calcular a meta, falta: ${m.falta.join(', ')}.</p>`;
  const mp = num(cfg().metaPeso);
  return `<div class="meta-res">
      <div><span class="hint">Meta diária</span><strong>${fmt(m.meta)} <small>kcal</small></strong></div>
      <div class="meta-linhas">
        <p><span>Taxa metabólica basal</span><b>${fmt(m.tmb)} kcal</b></p>
        <p><span>Gasto estimado do dia</span><b>${fmt(m.gasto)} kcal</b></p>
        <p><span>Déficit para perder peso</span><b>−${fmt(m.deficit)} kcal</b></p>
        <p><span>Perda esperada</span><b>~${fmt1(m.kgSemana)} kg/semana</b></p>
        ${(() => { const mm = metaMacros(); return mm ? `<p><span>Proteína · Carbo · Gordura</span><b>${mm.p} · ${mm.c} · ${mm.g} g</b></p>` : ''; })()}
      </div>
    </div>
    <p class="hint">Calculada com seu último peso (${fmt1(m.peso)} kg), ${m.idade} anos e ${fmt(m.altura)} cm. Atualiza sozinha a cada novo peso.${m.limitado ? ' O ritmo foi reduzido para a meta não ficar abaixo da sua taxa basal.' : ''}${mp && m.peso <= mp ? ' Você atingiu a meta de peso: vale combinar com o médico ou a nutricionista os próximos passos.' : ''}</p>`;
}
function cardMeta() {
  const p = cfg();
  const opt = (lista, val) => lista.map(([v, t]) => `<option value="${v}" ${String(val) === v ? 'selected' : ''}>${t}</option>`).join('');
  return `<div class="card">
    <h3>Meta de calorias</h3>
    <p class="hint">Calculada para perda de peso a partir da sua taxa metabólica basal.</p>
    <div class="fields2">
      <div class="field"><label for="p-sexo">Sexo</label><select id="p-sexo" data-p="sexo"><option value="f" ${p.sexo !== 'm' ? 'selected' : ''}>Feminino</option><option value="m" ${p.sexo === 'm' ? 'selected' : ''}>Masculino</option></select></div>
      <div class="field"><label for="p-alt">Altura (cm)</label><input id="p-alt" inputmode="numeric" placeholder="ex.: 165" data-p="altura" value="${esc(p.altura || '')}"></div>
    </div>
    <div class="fields2">
      <div class="field"><label for="p-nasc">Nascimento</label><input id="p-nasc" type="date" data-p="nascimento" value="${esc(p.nascimento || '')}"></div>
      <div class="field"><label for="p-mp">Meta de peso (kg)</label><input id="p-mp" inputmode="decimal" data-p="metaPeso" value="${esc(p.metaPeso || '')}"></div>
    </div>
    <div class="field"><label for="p-ativ">Nível de atividade</label><select id="p-ativ" data-p="atividade">${opt(ATIVIDADES, p.atividade || '1.375')}</select></div>
    <div class="field"><label for="p-ritmo">Ritmo de perda</label><select id="p-ritmo" data-p="ritmo">${opt(RITMOS, p.ritmo || '500')}</select></div>
    <div id="meta-calc">${metaCalcHTML()}</div>
    <p class="disclaimer">Estimativa pela fórmula de Mifflin-St Jeor. Macros: proteína de 1,6 g por kg do peso-meta, gordura em 25% das calorias e carboidratos com o restante. Com Mounjaro o apetite costuma cair: evite ficar muito abaixo da meta e priorize proteína. Ajustes de dieta devem seguir a orientação do médico ou da nutricionista.</p>
  </div>`;
}

/* =====================================================================
   CARDIO — esteira, caminhada, bike etc. dentro das fichas
   Exercício de cardio: { tipo: 'cardio', nome, minutos, obs, plano: [{ de, ate, texto }] }
   "plano" guarda a orientação por semana (ex.: semanas 1–2, 3–4…), usando a
   data de início do plano (Ajustes) para mostrar a semana certa.
   ===================================================================== */
const DIAS_SEMANA = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
const SENSACOES = ['Leve', 'Moderado', 'Difícil'];

function semanaPlano() {
  const i = cfg().inicioPlano; if (!i) return null;
  const d = diasEntre(i, hoje());
  return d < 0 ? 1 : Math.floor(d / 7) + 1;
}
function planoDaSemana(e) {
  const pl = Array.isArray(e.plano) ? e.plano : [];
  if (!pl.length) return null;
  const w = semanaPlano() || 1;
  const fim = Math.max(...pl.map(x => x.ate));
  const p = pl.find(x => w >= x.de && w <= x.ate) || (w > fim ? pl[pl.length - 1] : pl[0]);
  return { semana: w, ...p };
}
const planoTexto = (pl) => (pl || []).map(p => `${p.de}${p.ate !== p.de ? '–' + p.ate : ''}: ${p.texto}`).join('\n');
function lerPlanoTexto(t) {
  return String(t || '').split(/\n+/).map(l => {
    const m = l.match(/^\s*(\d+)\s*(?:[–-]\s*(\d+))?\s*[:.)\-–]\s*(.+)$/);
    return m ? { de: +m[1], ate: +(m[2] || m[1]), texto: m[3].trim() } : null;
  }).filter(Boolean);
}

/* ---------- ficha → sessão → histórico ---------- */
function cardioParaSessao(e) {
  const p = planoDaSemana(e);
  let min = num(e.minutos) || 20;
  // plano tipo "30–40 min" (sem etapas) define a duração da semana
  const mw = p && !/;/.test(p.texto) && p.texto.match(/^(\d{1,3})\s*(?:[–-]\s*(\d{1,3}))?\s*min/);
  if (mw) min = num(mw[2] || mw[1]);
  return {
    tipo: 'cardio', nome: e.nome, minutos: min,
    orientacao: p ? p.texto : (e.obs || ''), semana: p ? p.semana : null,
    feitoMin: String(min), km: '', sensacao: '', feito: false, timerFim: null, restante: null
  };
}
const cardioParaSalvar = (e) => ({ tipo: 'cardio', nome: e.nome, minutos: num(e.feitoMin) || 0, km: num(e.km) || null, sensacao: e.sensacao || '', feito: !!e.feito });
function cardioResumo(e) {
  if (!e.feito) return 'não feito';
  return [`${fmt(e.minutos)} min`, e.km ? `${fmt1(e.km)} km` : '', e.sensacao].filter(Boolean).join(' · ');
}
function resumoFeito(s) {
  const series = s.exercicios.reduce((a, e) => a + (e.series || []).filter(x => x.feito).length, 0);
  const c = s.exercicios.filter(e => e.tipo === 'cardio' && e.feito);
  return [series ? `${series} séries feitas` : '', c.length ? `cardio: ${c.map(e => `${esc(e.nome)} ${fmt(num(e.feitoMin) || 0)} min`).join(', ')}` : ''].filter(Boolean).join(' · ') + '.';
}
function cardioDaEdicao(e) {
  return {
    tipo: 'cardio', nome: e.nome.trim(), minutos: num(e.minutos) || 20,
    plano: lerPlanoTexto(e.planoTxt != null ? e.planoTxt : planoTexto(e.plano)), obs: String(e.obs || '').trim()
  };
}
function resumoCardio7d() {
  const lim = addDias(hoje(), -6);
  const min = S.treinos.filter(t => t.data >= lim).reduce((s, t) => s + t.exercicios.filter(e => e.tipo === 'cardio' && e.feito).reduce((a, e) => a + (num(e.minutos) || 0), 0), 0);
  const st = S.atividades.filter(a => a.data >= lim && !ehForca(a.tipo)).reduce((s, a) => s + (a.duracaoMin || 0), 0);
  if (!min && !st) return '<p class="hint">Cardio nos últimos 7 dias: nenhum registro ainda.</p>';
  return `<p class="hint">Cardio nos últimos 7 dias: <b>${fmt(min)} min</b> no app${st ? ` · ${fmt(st)} min em atividades do Strava` : ''}.</p>`;
}

/* ---------- editor de ficha ---------- */
function cardioEditHTML(e, i) {
  return `<div class="ex-edit cardio-edit">
    <div class="top-row"><input aria-label="Cardio ${i + 1}" placeholder="ex.: Esteira" data-fe="nome" data-i="${i}" value="${esc(e.nome)}"><button class="x" data-a="feRem" data-i="${i}" type="button" aria-label="Remover cardio">×</button></div>
    <div class="fields2">
      <div class="field"><label for="fe-m${i}">Minutos</label><input id="fe-m${i}" inputmode="numeric" data-fe="minutos" data-i="${i}" value="${esc(e.minutos)}"></div>
      <div class="field"><label>Tipo</label><span class="chip teal tipo-chip">Cardio</span></div>
    </div>
    <div class="field"><label for="fe-o${i}">Orientação</label><input id="fe-o${i}" data-fe="obs" data-i="${i}" value="${esc(e.obs || '')}" placeholder="ex.: caminhada rápida, inclinação 2%"></div>
    <div class="field"><label for="fe-p${i}">Plano por semana (opcional)</label><textarea id="fe-p${i}" rows="4" data-fe="planoTxt" data-i="${i}" placeholder="1–2: 5 min leve; 10 min rápido; 5 min leve&#10;3–4: alternar 1 min trote + 2 min caminhada">${esc(e.planoTxt != null ? e.planoTxt : planoTexto(e.plano))}</textarea></div>
  </div>`;
}

/* ---------- treino em andamento ---------- */
function restanteCardio(e) {
  if (e.timerFim) return Math.max(0, Math.ceil((e.timerFim - Date.now()) / 1000));
  return e.restante != null ? e.restante : e.minutos * 60;
}
function cardioSessaoHTML(e, ei) {
  const r = restanteCardio(e), total = e.minutos * 60;
  const rotulo = e.timerFim ? 'Pausar' : (r < total && r > 0 ? 'Continuar' : 'Iniciar');
  return `<div class="card ex cardio ${e.feito ? 'feito' : ''}">
    ${mostrarDemos() ? demoHTML(e.nome) : ''}
    <div>
      <div class="row between"><h3>${esc(e.nome)}</h3><span class="chip teal">Cardio · ${fmt(e.minutos)} min</span></div>
      ${e.semana ? `<p class="meta">Semana ${e.semana} do plano</p>` : ''}
      ${e.orientacao ? `<p class="orient">${esc(e.orientacao)}</p>` : ''}
    </div>
    <div class="cardio-timer">
      <strong id="ct-${ei}" class="num">${mmss(r)}</strong>
      <div class="row"><button class="btn primary" data-a="cardioPlay" data-e="${ei}" type="button">${rotulo}</button><button class="btn" data-a="cardioZerar" data-e="${ei}" type="button">Zerar</button></div>
    </div>
    <div class="fields2">
      <div class="field"><label for="cm-${ei}">Minutos feitos</label><input id="cm-${ei}" inputmode="numeric" data-cf="feitoMin" data-e="${ei}" value="${esc(e.feitoMin)}"></div>
      <div class="field"><label for="ck-${ei}">Distância (km)</label><input id="ck-${ei}" inputmode="decimal" data-cf="km" data-e="${ei}" placeholder="opcional" value="${esc(e.km)}"></div>
    </div>
    <div class="field"><label>Como foi?</label><div class="segmented" role="group" aria-label="Como foi o cardio">${SENSACOES.map(v => `<button type="button" data-a="cardioSens" data-e="${ei}" data-v="${v}" class="${e.sensacao === v ? 'on' : ''}" aria-pressed="${e.sensacao === v}">${v}</button>`).join('')}</div></div>
    <button class="btn wide ${e.feito ? 'ok-cardio' : 'primary'}" data-a="cardioOk" data-e="${ei}" type="button">${e.feito ? '✓ Cardio concluído' : 'Marcar cardio como feito'}</button>
  </div>`;
}

Object.assign(ACOES, {
  feAddCardio() { fichaEdit.exercicios.push({ tipo: 'cardio', nome: 'Esteira', minutos: 20, obs: '', plano: [] }); renderFicha(); },
  cardioPlay(b) {
    destravarAudio();
    const e = sessao.exercicios[+b.dataset.e];
    if (e.timerFim) { e.restante = restanteCardio(e); e.timerFim = null; }
    else { let r = restanteCardio(e); if (!r) r = e.minutos * 60; e.timerFim = Date.now() + r * 1000; pedirWakeLock(); }
    salvarSessao(); render();
  },
  cardioZerar(b) { const e = sessao.exercicios[+b.dataset.e]; e.timerFim = null; e.restante = null; salvarSessao(); render(); },
  cardioSens(b) { const e = sessao.exercicios[+b.dataset.e]; e.sensacao = e.sensacao === b.dataset.v ? '' : b.dataset.v; salvarSessao(); render(); },
  cardioOk(b) {
    const e = sessao.exercicios[+b.dataset.e];
    e.feito = !e.feito;
    if (e.feito && e.timerFim) { e.restante = restanteCardio(e); e.timerFim = null; }
    if (e.feito && e.restante != null && e.restante < e.minutos * 60) e.feitoMin = String(Math.max(1, Math.round((e.minutos * 60 - e.restante) / 60)));
    salvarSessao(); render();
  }
});

function inputCardio(t) {
  if (!t.dataset.cf || !sessao) return false;
  sessao.exercicios[+t.dataset.e][t.dataset.cf] = t.value; salvarSessao();
  return true;
}

// contagem regressiva do cardio
setInterval(() => {
  if (!sessao) return;
  sessao.exercicios.forEach((e, ei) => {
    if (e.tipo !== 'cardio' || !e.timerFim) return;
    const r = restanteCardio(e);
    const el = document.getElementById('ct-' + ei); if (el) el.textContent = mmss(r);
    if (r <= 0) {
      e.timerFim = null; e.restante = 0; e.feito = true; e.feitoMin = String(e.minutos);
      bip(); try { navigator.vibrate && navigator.vibrate([300, 120, 300]); } catch (err) { }
      salvarSessao(); if ($('#sheet').hidden) render(); toast(`${e.nome} concluído!`);
    }
  });
}, 1000);

const normTxt = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();

function todosAlimentos() {
  const meus = S.alimentos.map(a => ({ nome: a.nome, meu: true, id: a.id, kcalPorcao: num(a.kcal) || 0, p: a.p, c: a.c, g: a.g, porcoes: [[a.porcao || 'porção', 1]], un: null }));
  return [...meus, ...ALIMENTOS];
}
function buscarAlimentos(q) {
  const n = normTxt(q); if (n.length < 2) return [];
  const palavras = n.split(/\s+/).map(p => p.length > 3 ? p.replace(/s$/, '') : p);
  return todosAlimentos().map(a => {
    const nm = normTxt(a.nome);
    if (!palavras.every(p => nm.includes(p) || nm.includes(p.replace(/s$/, '')))) return null;
    const score = (nm.startsWith(n) ? 0 : nm.split(/[\s(/-]+/).some(w => w.startsWith(palavras[0])) ? 1 : 2) - (a.meu ? 0.5 : 0);
    return { a, score };
  }).filter(Boolean).sort((x, y) => x.score - y.score || x.a.nome.length - y.a.nome.length).slice(0, 7).map(x => x.a);
}
// "150g arroz" -> {qtd:150, un:'g', resto:'arroz'} ; "2 ovos" -> {qtd:2, resto:'ovos'}
function lerQuantidade(txt) {
  const m = String(txt).match(/^\s*(\d+(?:[.,]\d+)?)\s*(g|gr|gramas|ml)?\s+(.+)$/i);
  if (!m) return { resto: txt };
  return { qtd: num(m[1]), un: m[2] ? (m[2].toLowerCase() === 'ml' ? 'ml' : 'g') : null, resto: m[3] };
}
// gramas (ou ml) da quantidade escolhida; para "meus alimentos", número de porções
function gramasDe(sel) {
  const f = sel.food, q = num(sel.qtd) || 0;
  if (f.meu) return q;
  if (sel.porcao === 'g' || sel.porcao === 'ml') return q;
  const p = f.porcoes.find(x => x[0] === sel.porcao) || f.porcoes[0];
  return q * p[1];
}
function kcalDe(sel) {
  if (!sel || !sel.food) return 0;
  const f = sel.food, g = gramasDe(sel);
  return f.meu ? g * f.kcalPorcao : g * f.k100 / 100;
}
// { p, c, g } em gramas
function macrosDe(sel) {
  if (!sel || !sel.food) return { p: 0, c: 0, g: 0 };
  const f = sel.food, q = gramasDe(sel);
  if (f.meu) return { p: q * (num(f.p) || 0), c: q * (num(f.c) || 0), g: q * (num(f.g) || 0) };
  return { p: q * f.p100 / 100, c: q * f.c100 / 100, g: q * f.g100 / 100 };
}
const r1 = (v) => Math.round((num(v) || 0) * 10) / 10;
const macroTxt = (m) => `P ${fmt1(r1(m.p))} g · C ${fmt1(r1(m.c))} g · G ${fmt1(r1(m.g))} g`;
function macrosRefeicoes(lista) {
  return (lista || []).reduce((t, r) => ({ p: t.p + (num(r.p) || 0), c: t.c + (num(r.c) || 0), g: t.g + (num(r.g) || 0) }), { p: 0, c: 0, g: 0 });
}
// barras de macros do dia, com as metas de metaMacros()
function macrosDiaHTML(refeicoes, compacto) {
  const t = macrosRefeicoes(refeicoes), mm = metaMacros();
  const itens = [['Proteína', 'p', 'prot'], ['Carboidratos', 'c', 'carb'], ['Gordura', 'g', 'gord']];
  if (compacto) return `<div class="macros-mini">${itens.map(([n, k, cls]) => `<span><i class="dot ${cls}"></i>${n.slice(0, 4)}. <b>${fmt(t[k])}</b>${mm ? `/${fmt(mm[k])}` : ''} g</span>`).join('')}</div>`;
  return `<div class="macros">${itens.map(([n, k, cls]) => {
    const meta = mm && mm[k], pct = meta ? Math.min(100, t[k] / meta * 100) : 0;
    return `<div class="macro"><div class="row between"><span>${n}</span><span class="num"><b>${fmt(t[k])}</b>${meta ? ` / ${fmt(meta)}` : ''} g</span></div>${meta ? `<div class="bar ${cls}${t[k] > meta * 1.1 && k !== 'p' ? ' over' : ''}"><b style="width:${pct.toFixed(0)}%"></b></div>` : ''}</div>`;
  }).join('')}</div>`;
}
function descDe(sel) {
  const f = sel.food, q = fmt1(num(sel.qtd) || 0);
  if (sel.porcao === 'g' || sel.porcao === 'ml') return `${f.nome} · ${q} ${sel.porcao}`;

}

function carregarScript(src) {
  return new Promise((ok, erro) => {
    if (document.querySelector(`script[src="${src}"]`)) return ok();
    const s = document.createElement('script'); s.src = src; s.onload = ok;
    s.onerror = () => erro(new Error('sem internet para ler esse tipo de arquivo'));
    document.head.appendChild(s);
  });
}

const RX_SXR = /(\d{1,2})\s*(?:x|×|\*)\s*(\d{1,3}(?:\s*(?:-|–|a|\/)\s*\d{1,3})?(?:\s*(?:s|seg|segundos)\b)?(?:\s*(?:reps?|repetiç\w*))?(?:\s*cada\s+(?:perna|lado|braço))?)/i;
const RX_SERIES = /(\d{1,2})\s*s[ée]ries?\s*(?:de)?\s*(\d{1,3}(?:\s*(?:-|–|a)\s*\d{1,3})?)/i;

function lerDescanso(txt) {
  let m = txt.match(/(\d+(?:[.,]\d+)?)\s*(?:min|minutos?|')/i);
  if (m) return Math.round(num(m[1]) * 60);
  m = txt.match(/(\d{2,3})\s*(?:s|seg|segundos|")(?![a-z])/i) || txt.match(/desc\w*\.?\s*:?\s*(\d{2,3})/i);
  return m ? num(m[1]) : null;
}
function limparNome(s) {
  return s.replace(/[\s\-–—:|,;.]+$/, '').replace(/^[\s\-–—:|,;.]+/, '').replace(/\s{2,}/g, ' ').trim();
}
function ehCabecalho(l) {
  if (RX_SXR.test(l) || RX_SERIES.test(l)) return false;
  if (/^(treino|ficha|dia|day|workout)\b/i.test(l)) return true;
  if (/\b(treino|ficha)\s*[A-F]\b/i.test(l) && l.length < 50) return true;   // "Segunda — Treino A"
  if (/^[A-F]\s*[-:–).]\s*\S/.test(l) && !RX_SXR.test(l)) return true;
  if (/^[A-F]$/.test(l)) return true;
  return /:$/.test(l) && !RX_SXR.test(l) && l.length < 40;
}
function nomeFicha(l, idx) {
  let m = l.match(/^(?:treino|ficha)\s*([A-F])\b\s*[-:–)]*\s*(.*)$/i);
  if (m) return { nome: `Treino ${m[1].toUpperCase()}`, foco: limparNome(m[2]) };
  m = l.match(/^(.*?)\b(?:treino|ficha)\s*([A-F])\b(.*)$/i);
  if (m) return { nome: `Treino ${m[2].toUpperCase()}`, foco: limparNome((m[1] + ' ' + m[3]).trim()) };
  m = l.match(/^([A-F])\s*[-:–).]*\s*(.*)$/);
  if (m) return { nome: `Treino ${m[1]}`, foco: limparNome(m[2]) };
  const t = limparNome(l.replace(/^(treino|ficha)\s*/i, ''));
  return { nome: t ? `Treino ${t}`.slice(0, 40) : `Treino ${String.fromCharCode(65 + idx)}`, foco: '' };
}

function parseTexto(txt) {
  const fichas = []; let cur = null;
  // se o arquivo usa "3x12" em algum lugar, só aceita como exercício as linhas com séries x reps
  const estrito = String(txt).split(/\r?\n/).some(l => RX_SXR.test(l) || RX_SERIES.test(l));
  // descanso geral do documento, ex.: "Descanse 60–90 segundos entre séries" (usa o maior valor)
  const dg = String(txt).match(/descans\w*\s+(?:de\s+)?(\d{2,3})(?:\s*(?:-|–|a)\s*(\d{2,3}))?\s*(?:s|seg|segundos)\b/i);
  const descansoPadrao = dg ? num(dg[2] || dg[1]) : 60;
  let pendente = '';   // nome de exercício numa linha e "2 × 12" na linha seguinte
  const nova = (info) => { cur = { nome: info.nome, foco: info.foco || '', exercicios: [] }; fichas.push(cur); };
  for (const raw of String(txt).split(/\r?\n/)) {
    let l = raw.replace(/\t/g, ' ').replace(/^\s*(?:\d{1,2}\s*[.)\-–]\s+|[-•*·▪●]\s*)/, '').trim();
    if (!l) continue;
    if (/^(exerc[ií]cios?|s[ée]ries)\b/i.test(l)) continue;           // cabeçalho de tabela
    if (ehCabecalho(l)) { nova(nomeFicha(l, fichas.length)); pendente = ''; continue; }
    const c = l.match(RX_CARDIO);
    if (c && !RX_SXR.test(l)) {
      if (!cur) nova({ nome: 'Treino A', foco: '' });
      const nc = limparNome(l.slice(0, l.search(/\d/)).replace(/\b(por|de|durante|em)\s*$/i, '')) || c[1];
      cur.exercicios.push({ tipo: 'cardio', nome: nc.charAt(0).toUpperCase() + nc.slice(1), minutos: num(c[2]), obs: '', plano: [] });
      pendente = ''; continue;
    }
    let m = l.match(RX_SXR) || l.match(RX_SERIES);
    let nome, series = 3, reps = '10-12', resto = '';
    if (m) {
      nome = limparNome(l.slice(0, m.index));
      series = num(m[1]) || 3; reps = m[2].replace(/\s+/g, ' ').replace(/\s*(reps?|repetiç\w*)$/i, '').trim();
      resto = l.slice(m.index + m[0].length);
      if (!nome) nome = pendente || limparNome(resto.replace(/\d+\s*(?:s|seg|min)\b.*/i, ''));
      pendente = '';
    } else {
      // linha sem séries x reps: só aceita se parecer nome de exercício
      pendente = (!/\d/.test(l) && !/:/.test(l) && l.split(/\s+/).length <= 8) ? limparNome(l) : '';
      if (estrito || !cur || /\d/.test(l) || l.split(/\s+/).length > 6 || /:/.test(l)) continue;
      nome = limparNome(l);
    }
    if (!nome || nome.length < 3) continue;
    if (!cur) nova({ nome: 'Treino A', foco: '' });
    cur.exercicios.push({ nome: nome.charAt(0).toUpperCase() + nome.slice(1), series, reps, descanso: lerDescanso(resto) || descansoPadrao });
  }
  const res = fichas.filter(f => f.exercicios.length);
  completarCardio(String(txt), res);
  res.forEach(f => { if (f.dia == null) { const d = diaDoTexto(f.foco) ?? diaDoTexto(f.nome); if (d != null) f.dia = d; } });
  return res;
}

const RX_CARDIO = /^(esteira|caminhada|caminhar|corrida|trote|bike|bicicleta|el[ií]ptico|escada|transport\w*|remo|spinning|cardio|pular corda)\b[^0-9\n]{0,30}?(\d{1,3})\s*(?:min|minutos|')/i;
const DIAS_MAPA = { domingo: 0, dom: 0, segunda: 1, seg: 1, terca: 2, ter: 2, quarta: 3, qua: 3, quinta: 4, qui: 4, sexta: 5, sex: 5, sabado: 6, sab: 6 };
function diaDoTexto(t) {
  const w = normTxt(t || '').split(/[^a-z]+/).find(p => p in DIAS_MAPA);
  return w ? DIAS_MAPA[w] : null;
}
// Cardio descrito fora das fichas: "20 min de esteira primeiro" vira o 1º exercício de cada ficha;
// "Domingo — caminhada" com "Semanas 1–2: 20–30 min…" vira uma ficha de caminhada com plano por semana.
function completarCardio(txt, fichas) {
  if (!fichas.length) return;
  const g = txt.match(/(\d{1,3})\s*min(?:utos)?\s+de\s+(esteira|bike|bicicleta|el[ií]ptico|caminhada|cardio)\b/i);
  if (g && !fichas.some(f => f.exercicios.some(e => e.tipo === 'cardio'))) {
    const nomeC = g[2].charAt(0).toUpperCase() + g[2].slice(1).toLowerCase();
    const antes = /antes|primeiro|in[ií]cio/i.test(txt.slice(Math.max(0, g.index - 80), g.index + 120));
    fichas.forEach(f => f.exercicios[antes ? 'unshift' : 'push']({ tipo: 'cardio', nome: nomeC, minutos: num(g[1]), obs: '', plano: [] }));
  }
  const linhas = txt.split(/\r?\n/);
  // tabela de progressão do cardio: linhas "1–2   5 min a 3,0 km/h; …" até a seção de musculação
  const ini = linhas.findIndex(l => /(plano de esteira|progress\w*\s+do\s+cardio)/i.test(l));
  if (ini >= 0) {
    const plano = [];
    for (let k = ini + 1; k < linhas.length && !/muscula/i.test(linhas[k]); k++) {
      const m = linhas[k].trim().match(/^(\d{1,2})\s*[–-]\s*(\d{1,2})\s{2,}(.+)$/);
      if (!m) continue;
      let texto = m[3].split(/\s{2,}/)[0].trim();
      if (linhas[k + 1] && !/^\s*\d{1,2}\s*[–-]/.test(linhas[k + 1]) && !/muscula/i.test(linhas[k + 1])) {
        const cont = linhas[k + 1].trim().match(/^[^.]*\./);
        if (cont) texto += ' ' + cont[0];
      }
      plano.push({ de: +m[1], ate: +m[2], texto });
    }
    if (plano.length) fichas.forEach(f => f.exercicios.forEach(e => { if (e.tipo === 'cardio' && !(e.plano && e.plano.length)) e.plano = plano; }));
  }
  const i = linhas.findIndex(l => /domingo/i.test(l) && /caminhada/i.test(l) && l.trim().length < 45);
  if (i >= 0 && !fichas.some(f => /caminhada/i.test(f.nome))) {
    const bloco = linhas.slice(i + 1, i + 5).join(' ');
    const plano = [...bloco.matchAll(/semanas?\s*(\d+)\s*[–-]\s*(\d+)\s*:\s*([^.]+)/gi)].map(m => ({ de: +m[1], ate: +m[2], texto: m[3].trim().replace(/,\s*se$/i, '') }));
    const mins = plano.length ? (plano[0].texto.match(/(\d+)\s*(?:[–-]\s*(\d+))?\s*min/) || []) : [];
    fichas.push({ nome: 'Caminhada', foco: 'Domingo', dia: 0, exercicios: [{ tipo: 'cardio', nome: 'Caminhada', minutos: num(mins[2] || mins[1]) || 30, obs: 'Ritmo em que consiga conversar', plano }] });
  }
}

function parseTabela(rows) {
  rows = rows.map(r => r.map(c => String(c ?? '').trim())).filter(r => r.some(Boolean));
  const hi = rows.findIndex(r => r.some(c => /exerc/i.test(c)));
  if (hi < 0) return parseTexto(rows.map(r => r.filter(Boolean).join(' ')).join('\n'));
  const h = rows[hi].map(normTxt);
  const col = (re) => h.findIndex(c => re.test(c));
  const cF = col(/^(ficha|treino|dia|divisao)/), cE = col(/exerc/), cS = col(/serie/), cR = col(/rep/), cD = col(/descanso|interv|pausa/);
  const fichas = []; const por = {}; let atual = 'Treino A';
  for (const r of rows.slice(hi + 1)) {
    if (cF >= 0 && r[cF]) atual = nomeFicha(r[cF], fichas.length).nome;
    const nome = r[cE]; if (!nome) { if (r.filter(Boolean).length === 1 && ehCabecalho(r.find(Boolean))) atual = nomeFicha(r.find(Boolean), fichas.length).nome; continue; }
    if (!por[atual]) { por[atual] = { nome: atual, foco: '', exercicios: [] }; fichas.push(por[atual]); }
    let series = num(r[cS]), reps = cR >= 0 ? r[cR] : '';
    const m = (r[cS] || '').match(RX_SXR); if (m) { series = num(m[1]); reps = reps || m[2]; }
    por[atual].exercicios.push({ nome, series: series || 3, reps: reps || '10-12', descanso: (cD >= 0 && lerDescanso(r[cD] + (/^\d+$/.test(r[cD]) ? 's' : ''))) || 60 });
  }
  return fichas.filter(f => f.exercicios.length);
}

async function lerArquivo(file) {
  const nome = file.name.toLowerCase();
  if (/\.(jpe?g|png|heic|webp)$/.test(nome)) throw new Error('foto ainda não é lida automaticamente. Use planilha, PDF com texto ou cole o texto');
  if (nome.endsWith('.json')) {
    const j = JSON.parse(await file.text());
    const arr = Array.isArray(j) ? j : j.fichas;
    if (!Array.isArray(arr)) throw new Error('JSON sem lista de fichas');
    const fs = arr.map(f => ({
      nome: f.nome || 'Treino', foco: f.foco || '', dia: f.dia == null || f.dia === '' ? null : Number(f.dia),
      exercicios: (f.exercicios || []).map(e => e.tipo === 'cardio'
        ? { tipo: 'cardio', nome: e.nome, minutos: num(e.minutos) || 20, obs: e.obs || '', plano: Array.isArray(e.plano) ? e.plano.map(p => ({ de: +p.de, ate: +(p.ate || p.de), texto: String(p.texto || '') })) : [] }
        : { nome: e.nome, series: num(e.series) || 3, reps: String(e.reps || '10-12'), descanso: num(e.descanso) || 60 })
    }));
    if (j.inicioPlano) fs.inicioPlano = j.inicioPlano;
    return fs;
  }
  if (/\.(xlsx|xls|ods)$/.test(nome)) {
    await carregarScript(LIB_XLSX);
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    let todas = [];
    wb.SheetNames.forEach(sn => {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: '' });
      let fs = parseTabela(rows);
      // várias abas sem coluna de ficha: cada aba vira uma ficha com o nome da aba
      if (wb.SheetNames.length > 1 && fs.length === 1 && fs[0].nome === 'Treino A') fs[0].nome = nomeFicha(sn, todas.length).nome;
      todas = todas.concat(fs);
    });
    return todas;
  }
  if (nome.endsWith('.pdf')) {
    await carregarScript(LIB_PDF);
    pdfjsLib.GlobalWorkerOptions.workerSrc = LIB_PDF_WORKER;
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    let linhas = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const tc = await (await pdf.getPage(i)).getTextContent();
      const porY = {};
      tc.items.forEach(it => { const y = Math.round(it.transform[5] / 3); (porY[y] = porY[y] || []).push(it); });
      Object.keys(porY).map(Number).sort((a, b) => b - a).forEach(y => linhas.push(porY[y].sort((a, b) => a.transform[4] - b.transform[4]).map(it => it.str).join(' ')));
    }
    const fs = parseTexto(linhas.join('\n'));
    if (!fs.length) throw new Error('não achei exercícios no PDF (se for uma foto escaneada, cole o texto)');
    return fs;
  }
  const txt = await file.text();
  if (nome.endsWith('.csv')) {
    const sep = (txt.split('\n')[0].match(/;/g) || []).length > (txt.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
    return parseTabela(txt.split(/\r?\n/).map(l => l.split(sep).map(c => c.replace(/^"|"$/g, ''))));
  }
  return parseTexto(txt);
}
