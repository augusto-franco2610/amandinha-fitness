function mostrarPrevia(fichas) {
  impPrev = fichas;
  const box = $('#imp-prev'); if (!box) return;
  if (!fichas.length) { box.innerHTML = '<p class="empty">Não encontrei exercícios. Confira se cada linha tem o nome e as séries, como “Remada baixa 3x12”.</p>'; return; }
  const total = fichas.reduce((s, f) => s + f.exercicios.length, 0);
  box.innerHTML = `<h3>Encontrei ${fichas.length} ficha${fichas.length > 1 ? 's' : ''} e ${total} exercícios</h3>
    ${fichas.map(f => `<div class="card prev"><strong>${esc(f.nome)}${f.foco ? ' · ' + esc(f.foco) : ''}</strong>
      ${f.exercicios.map(e => e.tipo === 'cardio'
        ? `<div class="item"><span>${esc(e.nome)} <span class="chip teal">cardio</span>${e.plano && e.plano.length ? `<br><span class="hint">plano para ${Math.max(...e.plano.map(p => p.ate))} semanas</span>` : ''}</span><span class="k">${fmt(e.minutos)} min</span><span></span></div>`
        : `<div class="item"><span>${esc(e.nome)}</span><span class="k">${e.series}×${esc(e.reps)} · ${e.descanso}s</span><span></span></div>`).join('')}</div>`).join('')}
    ${fichas.inicioPlano ? `<p class="hint">Início do plano: ${dataCurta(fichas.inicioPlano)}.</p>` : ''}
    <button class="cta" data-a="impUsar" type="button">Usar estas fichas</button>
    <p class="hint">Troca as fichas de exemplo e as que tiverem o mesmo nome (Treino A, B…). Suas outras fichas continuam.</p>
    <button class="btn wide" data-a="impAdd" type="button">Adicionar sem apagar nenhuma</button>
    <button class="link-danger" data-a="impSubst" type="button">Apagar todas as fichas e usar só estas</button>`;
  box.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function salvarImport(modo) {
  if (!impPrev) return;
  const nomesNovos = new Set(impPrev.map(f => normTxt(f.nome)));
  if (modo === 'tudo') S.fichas.slice().forEach(f => store.del('fichas', f.id));
  else if (modo === 'usar') S.fichas.slice().filter(f => f.exemplo || nomesNovos.has(normTxt(f.nome))).forEach(f => store.del('fichas', f.id));
  const base = S.fichas.length;
  impPrev.forEach((f, i) => store.put('fichas', { id: novoId(), nome: f.nome, foco: f.foco, dia: f.dia ?? null, ordem: base + i, exercicios: f.exercicios }));
  const temPlano = impPrev.some(f => f.exercicios.some(e => e.plano && e.plano.length));
  if (impPrev.inicioPlano || (temPlano && !cfg().inicioPlano)) salvarCfg({ inicioPlano: impPrev.inicioPlano || hoje() });
  const n = impPrev.length, comCardio = impPrev.some(f => f.exercicios.some(e => e.tipo === 'cardio'));
  impPrev = null; fecharSheet(); aba = 'treino'; render(true);
  toast(`${n} ficha${n > 1 ? 's importadas' : ' importada'}${comCardio ? ', com cardio' : ''}.`);
}

Object.assign(ACOES, {

});

async function changeImport(t) {
  if (t.id !== 'imp-file' || !t.files[0]) return false;
  const box = $('#imp-prev'); box.innerHTML = '<p class="hint">Lendo arquivo…</p>';
  try { mostrarPrevia(await lerArquivo(t.files[0])); }
  catch (e) { box.innerHTML = `<p class="empty">Não consegui ler: ${esc(e.message)}.</p>`; }
  t.value = '';
  return true;
}

/* =====================================================================
   STRAVA + LEMBRETES (notificações)
   Ambos usam o servidor em WORKER_URL (pasta servidor/ do repositório).
   ===================================================================== */
const servidorOk = () => !!WORKER_URL;
const stravaOk = () => !!(WORKER_URL && STRAVA_CLIENT_ID);
const stravaCfg = () => S.config.find(x => x.id === 'strava');
const TIPOS_STRAVA = {
  WeightTraining: 'Musculação', Workout: 'Treino', Run: 'Corrida', TrailRun: 'Trilha', Walk: 'Caminhada', Hike: 'Caminhada',
  Ride: 'Pedal', VirtualRide: 'Bike indoor', Swim: 'Natação', Yoga: 'Yoga', Pilates: 'Pilates', HighIntensityIntervalTraining: 'HIIT',
  Crossfit: 'Crossfit', Elliptical: 'Elíptico', StairStepper: 'Escada', Rowing: 'Remo', Dance: 'Dança'
};
const tipoStrava = (t) => TIPOS_STRAVA[t] || t || 'Atividade';
const ehForca = (t) => /WeightTraining|Workout|Crossfit|HighIntensity/i.test(t || '');

async function workerFetch(path, opts = {}) {
  const r = await fetch(WORKER_URL.replace(/\/$/, '') + path, opts);
  const txt = await r.text();
  let d = {}; try { d = JSON.parse(txt); } catch (e) { }
  if (!r.ok) throw new Error(d.erro || d.message || ('erro ' + r.status));
  return d;
}
const postJSON = (path, obj) => workerFetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(obj) });

/* ---------------- Strava ---------------- */
function conectarStrava() {
  if (!stravaOk()) { toast('O Strava ainda não foi configurado. Veja o passo 7 do README.'); return; }
  const st = novoId(); lsSet('af:stravaState', st);
  const volta = location.origin + location.pathname;
  location.href = `https://www.strava.com/oauth/authorize?client_id=${encodeURIComponent(STRAVA_CLIENT_ID)}&response_type=code&redirect_uri=${encodeURIComponent(volta)}&approval_prompt=auto&scope=read,activity:read_all&state=${st}`;
}
async function retornoStrava() {
  const q = new URLSearchParams(location.search);
  if (!q.has('code') && !q.has('error')) return;
  history.replaceState(null, '', location.pathname + location.hash);
  if (q.get('error')) { toast('Conexão com o Strava cancelada.'); return; }
  if (q.get('state') !== lsGet('af:stravaState', null)) { toast('Não consegui confirmar a conexão com o Strava. Tente de novo.'); return; }
  if (!/activity:read/.test(q.get('scope') || '')) { toast('Marque a permissão de ver atividades ao conectar o Strava.'); return; }
  try {
    const t = await postJSON('/strava/token', { code: q.get('code') });
    store.put('config', { id: 'strava', access: t.access_token, refresh: t.refresh_token, expira: t.expires_at, atleta: t.athlete ? `${t.athlete.firstname || ''} ${t.athlete.lastname || ''}`.trim() : '', ultimaSync: 0 });
    toast('Strava conectado!');
    await sincronizarStrava(true);
  } catch (e) { toast('Não consegui conectar ao Strava: ' + e.message); }
}
async function tokenStrava() {
  const c = stravaCfg(); if (!c) return null;
  if (c.expira * 1000 > Date.now() + 60000) return c.access;
  const t = await postJSON('/strava/token', { refresh_token: c.refresh });
  store.put('config', { ...c, access: t.access_token, refresh: t.refresh_token, expira: t.expires_at });
  return t.access_token;
}
async function stravaGet(path) {
  const tk = await tokenStrava();
  return workerFetch('/strava/api?path=' + encodeURIComponent(path), { headers: { Authorization: 'Bearer ' + tk } });
}
let sincronizando = false;
async function sincronizarStrava(forcar) {
  const c = stravaCfg();
  if (!c || !servidorOk() || sincronizando) return;
  if (!forcar && Date.now() - (c.ultimaSync || 0) < 30 * 60000) return;
  sincronizando = true;
  try {
    const desde = Math.floor((c.ultimaSync ? c.ultimaSync - 3 * 864e5 : Date.now() - 60 * 864e5) / 1000);
    const lista = await stravaGet(`/athlete/activities?after=${desde}&per_page=60`);
    let detalhes = 0;
    for (const a of lista) {
      const id = 's' + a.id;
      const ant = S.atividades.find(x => x.id === id);
      let cal = ant ? ant.calorias : null;
      if (cal == null && detalhes < 15) { try { const d = await stravaGet('/activities/' + a.id); cal = d.calories || null; } catch (e) { } detalhes++; }
      const inicio = String(a.start_date_local || a.start_date).replace('Z', '');
      store.put('atividades', {
        id, nome: a.name, tipo: a.sport_type || a.type, inicio, data: inicio.slice(0, 10),
        duracaoMin: Math.round((a.moving_time || a.elapsed_time || 0) / 60), distanciaKm: a.distance ? Math.round(a.distance / 100) / 10 : 0,
        calorias: cal != null ? Math.round(cal) : null, fcMedia: a.average_heartrate ? Math.round(a.average_heartrate) : null, fcMax: a.max_heartrate ? Math.round(a.max_heartrate) : null
      });
    }
    vincularTreinos();
    store.put('config', { ...stravaCfg(), ultimaSync: Date.now() });
    if (forcar) toast(lista.length ? `Strava: ${lista.length} atividade${lista.length > 1 ? 's' : ''} sincronizada${lista.length > 1 ? 's' : ''}.` : 'Strava em dia, nada novo.');
    sincronizando = false;
    if ($('#sheet').hidden) render();
  } catch (e) {
    console.error(e); if (forcar) toast('Erro ao sincronizar com o Strava: ' + e.message);
  } finally { sincronizando = false; }
}
// Completa calorias e FC dos treinos do app com a atividade de musculação do mesmo dia no Strava (vinda do Garmin)
function vincularTreinos() {
  S.treinos.forEach(t => {
    if (t.strava || (t.calorias && t.fcMedia)) return;
    const a = S.atividades.find(x => x.data === t.data && ehForca(x.tipo) && !S.treinos.some(o => o.strava === x.id));
    if (a) store.put('treinos', { ...t, strava: a.id, calorias: t.calorias || a.calorias, fcMedia: t.fcMedia || a.fcMedia });
  });
}

/* ---------------- Lembretes (Web Push) ---------------- */
const ehIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const instalado = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const pushSuportado = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const b64uBytes = (s) => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
const prefsLembrete = () => ({ peso: true, mounjaro: true, ...(cfg().lembretes || {}) });

function cardLembretes() {
  const p = prefsLembrete(); const on = lsGet('af:pushOn', false) && pushSuportado() && Notification.permission === 'granted';
  let estado;
  if (!servidorOk()) estado = '<p class="hint">Falta configurar o servidor de notificações (README, passo 7).</p>';
  else if (ehIOS && !instalado()) estado = '<p class="hint"><b>Primeiro adicione o app à Tela de Início</b> (Safari → Compartilhar → Adicionar à Tela de Início) e abra pelo ícone. O iPhone só manda notificação de app instalado.</p>';
  else if (!pushSuportado()) estado = '<p class="hint">Este navegador não aceita notificações.</p>';
  else estado = on ? '<p class="hint">Notificações ativas neste aparelho.</p>' : '';
  return `<div class="card"><h3>Lembretes</h3>
    <label class="check"><input type="checkbox" id="lb-peso" ${p.peso ? 'checked' : ''}> Peso todo dia às 07:00</label>
    <label class="check"><input type="checkbox" id="lb-mj" ${p.mounjaro ? 'checked' : ''}> Mounjaro toda sexta às 22:00</label>
    ${estado}
    <div class="row">${on ? '<button class="btn" data-a="testarPush" type="button">Enviar teste</button>' : `<button class="btn primary" data-a="ativarPush" type="button" ${!servidorOk() || (ehIOS && !instalado()) ? 'disabled' : ''}>Ativar notificações</button>`}</div>
  </div>`;
}
async function inscreverPush() {
  const reg = await navigator.serviceWorker.ready;
  const { key } = await workerFetch('/push/key');
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uBytes(key) });
  await postJSON('/push/subscribe', { subscription: sub.toJSON(), prefs: prefsLembrete() });
  return sub;
}
async function ativarPush() {
  if (!pushSuportado()) { toast('Este navegador não aceita notificações.'); return; }
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('Notificações bloqueadas. Libere em Ajustes do iPhone → Notificações → Amandinha.'); return; }
    await inscreverPush();
    lsSet('af:pushOn', true); toast('Lembretes ativados.'); abrirPerfil();
  } catch (e) { toast('Não consegui ativar: ' + e.message); }
}

function avisosHoje() {
  let s = '';
  const d = diaInfo(hoje());
  if (d.peso == null) {
    s += `<div class="card aviso"><div class="row between"><p class="eyebrow">Peso de hoje</p><span class="chip pink">pendente</span></div>

  }
  const u = aplicacoes()[0];
  const sexta = new Date().getDay() === 5;

  },

  async testarPush() {
    try { const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription(); if (!sub) { lsSet('af:pushOn', false); abrirPerfil(); return; } await postJSON('/push/test', { endpoint: sub.endpoint }); toast('Teste enviado. Deve chegar em segundos.'); }

    A: { hip: [80, 50], t: 4, th: 22, sh: 4, th2: -20, sh2: -42, ua: -28, fa: 15 },
    B: { hip: [80, 50], t: 4, th: -20, sh: -42, th2: 22, sh2: 4, ua: 26, fa: 70 },
    dicas: ['Postura ereta e ombros relaxados', 'Pise com o calcanhar e role até a ponta do pé', 'Ritmo em que consiga conversar; não precisa correr']
  },
  // vistas de frente
  lateral: {
    front: true, A: { a: 8 }, B: { a: 85 },
    render: (p) => frente({ braco: p.a }),
    dicas: ['Cotovelos levemente flexionados', 'Eleve os braços pelas laterais até a altura dos ombros', 'Desça devagar, sem usar impulso do corpo']
  },
  abdutora: {
    front: true, A: { d: 2 }, B: { d: 15 },
    render: (p) => frente({ sentada: true, abre: p.d }),
    dicas: ['Costas apoiadas e quadril encaixado no banco', 'Abra as pernas empurrando com a parte de fora das coxas', 'Volte devagar, sem deixar o peso bater']
  }
};

function frente(o) {
  const cx = 80; let s = `<line class="chao" x1="4" x2="156" y1="${G}" y2="${G}"/>`;
  if (o.sentada) {
    const hy = 64;
    s += `<rect class="eq" x="62" y="${hy + 3}" width="36" height="5" rx="2"/><line class="eq thin" x1="80" y1="${hy + 8}" x2="80" y2="${G}"/><line class="eq" x1="64" y1="${hy}" x2="64" y2="28"/><line class="eq" x1="96" y1="${hy}" x2="96" y2="28"/>`;
    [-1, 1].forEach(sd => {
      const kx = cx + sd * (6 + o.abre), ky = hy + 6;
      s += `<polyline class="fig" points="${cx + sd * 5},${hy} ${kx.toFixed(1)},${ky} ${(kx + sd * 1).toFixed(1)},${G - 2} ${(kx + sd * 5).toFixed(1)},${G - 2}"/>`;
      s += eq.rolo([kx + sd * 4, ky - 1]);
      s += `<polyline class="fig" points="${cx + sd * 8},${hy - 26} ${cx + sd * 13},${hy - 12} ${cx + sd * 16},${hy - 2}"/>`;
    });
    s += `<line class="fig" x1="${cx}" y1="${hy}" x2="${cx}" y2="${hy - 28}"/><line class="fig" x1="${cx - 8}" y1="${hy - 26}" x2="${cx + 8}" y2="${hy - 26}"/><circle class="cabeca" cx="${cx}" cy="${hy - 36}" r="${LEN.hd}"/>`;
    return s;
  }
  const hy = 50, sy = 22;
  [-1, 1].forEach(sd => {
    s += `<polyline class="fig" points="${cx + sd * 4},${hy} ${cx + sd * 6},${hy + 21} ${cx + sd * 7},${G}"/>`;
    const sh = [cx + sd * 9, sy + 2];
    const el = soma(sh, [Math.sin(rad(o.braco)) * 15 * sd, Math.cos(rad(o.braco)) * 15]);
    const hd = soma(el, [Math.sin(rad(o.braco + 8)) * 14 * sd, Math.cos(rad(o.braco + 8)) * 14]);
    s += `<polyline class="fig" points="${P(sh)} ${P(el)} ${P(hd)}"/>` + eq.halter(hd);
  });
  s += `<line class="fig" x1="${cx}" y1="${hy}" x2="${cx}" y2="${sy}"/><line class="fig" x1="${cx - 9}" y1="${sy + 2}" x2="${cx + 9}" y2="${sy + 2}"/><line class="fig" x1="${cx - 4}" y1="${hy}" x2="${cx + 4}" y2="${hy}"/><circle class="cabeca" cx="${cx}" cy="${sy - 8}" r="${LEN.hd}"/>`;
  return s;
}

const MAPA_PADROES = [
  [/flexora|flexao de joelho|leg curl/, 'flexora'], [/extensora/, 'extensora'], [/abdutora|abducao|adutora|aducao/, 'abdutora'],
  [/leg ?press|leg 45/, 'legpress'], [/bulgaro|afundo|avanco|passada|lunge/, 'bulgaro'], [/pelvica|hip thrust|ponte/, 'pelvica'],
  [/panturrilha|gemeos/, 'panturrilha'], [/stiff|terra|good morning|rdl/, 'stiff'], [/agacha|sumo|hack|smith/, 'agachamento'],
  [/supino|crucifixo|peck|fly|voador/, 'supino'], [/puxada|pulldown|barra fixa|pull ?down/, 'puxada'],
  [/remada (curvada|unilateral|cavalinho)|serrote|curvada/, 'curvada'], [/remada/, 'remada'],
  [/desenvolvimento|militar|arnold|press de ombro/, 'desenvolvimento'], [/lateral/, 'lateral'], [/frontal/, 'frontal'],
  [/triceps|testa|frances|pulley/, 'triceps'], [/rosca|biceps|martelo/, 'rosca'], [/gluteo|coice|kickback/, 'gluteo'],
  [/prancha|plank/, 'prancha'], [/abdominal|abdomen|crunch|infra/, 'abdominal'],
  [/esteira/, 'esteira'], [/caminhada|corrida|trote|caminhar/, 'caminhada']
];
const padraoDe = (nome) => { const n = normTxt(nome); const m = MAPA_PADROES.find(([re]) => re.test(n)); return m ? m[1] : null; };

function juntas(p) {
  let hip;
  const rise = p.rise || 0;
  if (p.foot != null) {
    const k = vec(p.th, LEN.th), a = vec(p.sh, LEN.sh);
    hip = [p.foot - k[0] - a[0], G - rise - k[1] - a[1]];
  } else hip = p.hip;
  const neck = soma(hip, [Math.sin(rad(p.t)) * LEN.t, -Math.cos(rad(p.t)) * LEN.t]);
  const head = soma(neck, [Math.sin(rad(p.t)) * (LEN.hd + 1.5), -Math.cos(rad(p.t)) * (LEN.hd + 1.5)]);
  const elbow = soma(neck, vec(p.ua, LEN.ua)), hand = soma(elbow, vec(p.fa, LEN.fa));
  const knee = soma(hip, vec(p.th, LEN.th)), ankle = soma(knee, vec(p.sh, LEN.sh));
  const toe = p.foot != null ? [ankle[0] + 6, G] : soma(ankle, vec(p.sh + 90, 5));
  const J = { hip, neck, head, elbow, hand, knee, ankle, toe };
  if (p.th2 != null) { J.knee2 = soma(hip, vec(p.th2, LEN.th)); J.ankle2 = soma(J.knee2, vec(p.sh2, LEN.sh)); J.toe2 = soma(J.ankle2, vec(p.sh2 + 90, 5)); }
  return J;
}
function desenhar(pd, p) {
  if (pd.front) return pd.render(p);
  const J = juntas(p);
  let s = `<line class="chao" x1="4" x2="156" y1="${G}" y2="${G}"/>` + (pd.est || '');
  if (J.knee2) s += `<polyline class="fig f2" points="${P(J.hip)} ${P(J.knee2)} ${P(J.ankle2)} ${P(J.toe2)}"/>`;
  s += `<polyline class="fig" points="${P(J.hip)} ${P(J.knee)} ${P(J.ankle)} ${P(J.toe)}"/>`;
  s += `<line class="fig" x1="${J.hip[0].toFixed(1)}" y1="${J.hip[1].toFixed(1)}" x2="${J.neck[0].toFixed(1)}" y2="${J.neck[1].toFixed(1)}"/>`;
  s += `<circle class="cabeca" cx="${J.head[0].toFixed(1)}" cy="${J.head[1].toFixed(1)}" r="${LEN.hd}"/>`;
  s += `<polyline class="fig" points="${P(J.neck)} ${P(J.elbow)} ${P(J.hand)}"/>`;
  if (pd.dyn) s += pd.dyn(J);
  return s;
}
function interp(A, B, k) {
  const o = {};
  for (const key in A) {
    const a = A[key], b = B[key] ?? a;
    o[key] = Array.isArray(a) ? a.map((v, i) => v + (b[i] - v) * k) : (typeof a === 'number' ? a + (b - a) * k : a);
  }
  return o;
}

const mostrarDemos = () => lsGet('af:demos', true) !== false;
function demoHTML(nome) {
  const pad = padraoDe(nome);
  const busca = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(nome + ' execução correta');
  if (!pad) {
    return `<div class="demo nodemo"><p class="hint">Sem animação para este exercício.</p><a class="video" href="${busca}" target="_blank" rel="noopener">Ver vídeo da execução ↗</a></div>`;
  }
  const pd = PADROES[pad];
  return `<div class="demo">
    <svg class="demo-svg" viewBox="0 0 160 100" data-pad="${pad}" role="img" aria-label="Demonstração de ${esc(nome)}">${desenhar(pd, pd.A)}</svg>
    <ul class="dicas">${pd.dicas.map(d => `<li>${esc(d)}</li>`).join('')}</ul>
    <a class="video" href="${busca}" target="_blank" rel="noopener">Ver vídeo da execução ↗</a>
  </div>`;
}

// laço de animação: só anima as figuras visíveis na tela
const reduzMov = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let ultimoQuadro = 0;
function animarDemos(ts) {
  requestAnimationFrame(animarDemos);
  if (ts - ultimoQuadro < 33) return; ultimoQuadro = ts;
  const svgs = document.querySelectorAll('.demo-svg'); if (!svgs.length) return;
  const H = window.innerHeight;
  // ciclo de 2,6 s: desce/volta com pausa curta em cada ponta
  const fase = (ts % 2600) / 2600;
  const tri = fase < 0.5 ? fase * 2 : 2 - fase * 2;
  const k = reduzMov ? 0.5 : (1 - Math.cos(Math.PI * Math.min(1, Math.max(0, (tri - 0.08) / 0.84)))) / 2;
  svgs.forEach(svg => {
    const r = svg.getBoundingClientRect(); if (r.bottom < 0 || r.top > H) return;
    const pd = PADROES[svg.dataset.pad]; if (!pd) return;
    svg.innerHTML = desenhar(pd, interp(pd.A, pd.B, k));
  });
}
requestAnimationFrame(animarDemos);

Object.assign(ACOES, {
  toggleDemos() { lsSet('af:demos', !mostrarDemos()); render(); }
});

/* ganchos de eventos usados pelo app principal */
function extraInput(t) { return inputCardio(t) || inputAlimento(t); }
function extraChange(t) {
  if (t.id === 'imp-file') { changeImport(t); return true; }
  if (t.id === 'lb-peso' || t.id === 'lb-mj') { changeLembretes(t); return true; }
  return changeAlimento(t);
}

if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window && !/claude/.test(location.hostname)) {
  navigator.serviceWorker.register('sw.js').catch(() => { });
}
iniciarApp();

</script>
