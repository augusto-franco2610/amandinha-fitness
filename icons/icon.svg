<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FF8A7A"/>
      <stop offset="0.55" stop-color="#F24B6E"/>
      <stop offset="1" stop-color="#C81E5A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#6B0A2A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <g filter="url(#sh)" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- letra A -->
    <path d="M318 790 L512 252 L706 790" stroke-width="104"/>
    <!-- barra do halter (travessão do A) -->
    <line x1="268" y1="612" x2="756" y2="612" stroke-width="40"/>
  </g>
  <g filter="url(#sh)" fill="#FFFFFF">
    <!-- anilhas -->
    <rect x="168" y="520" width="58" height="184" rx="22"/>
    <rect x="236" y="550" width="42" height="124" rx="16"/>
    <rect x="798" y="520" width="58" height="184" rx="22"/>
    <rect x="746" y="550" width="42" height="124" rx="16"/>
  </g>
</svg>
